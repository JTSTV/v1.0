name: Generate filelist
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sp/filelist.json
        run: |
          import os, json
          items = []
          root_dir = "sp"
          for name in os.listdir(root_dir):
            full_path = os.path.join(root_dir, name)
            rel_path = os.path.relpath(full_path)
            if name == ".thumb":
                continue
            if os.path.isdir(full_path):
                items.append({"name":name,"path":rel_path,"type":"dir"})
            else:
                items.append({"name":name,"path":rel_path,"type":"file"})
          with open("sp/filelist.json","w",encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
        shell: python3

      - name: Commit & Push filelist.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sp/filelist.json
          if git diff --staged --quiet; then
            echo "filelist.json无变化，跳过提交"
          else
            git commit -m "auto update filelist.json"
            git push
          fi