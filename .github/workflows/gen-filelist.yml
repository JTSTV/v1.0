name: Generate filelist
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sp/filelist.json
        run: |
          python3 << 'EOF'
          import os, json
          items = []
          root_dir = "sp"
          os.makedirs(root_dir, exist_ok=True)
          if os.path.exists(root_dir):
              for name in os.listdir(root_dir):
                  full_path = os.path.join(root_dir, name)
                  rel_path = os.path.relpath(full_path)
                  if name == ".thumb":
                      continue
                  if os.path.isdir(full_path):
                      items.append({"name":name,"path":rel_path,"type":"dir"})
                  else:
                      items.append({"name":name,"path":rel_path,"type":"file"})
          out_path = os.path.join(root_dir, "filelist.json")
          with open(out_path,"w",encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit & Push filelist.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sp/filelist.json
          if git diff --staged --quiet; then
            echo "No change, skip commit"
          else
            git commit -m "auto update filelist.json [skip ci]"
            git push
          fi