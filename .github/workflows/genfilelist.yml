name: 自动生成sp文件清单
on:
  push:
    branches: [ main ]
jobs:
  generate:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描sp目录生成filelist.json
        run: |
          cd sp
          python3 -c "
import os,json
out=[]
for name in os.listdir('.'):
    if name=='filelist.json':continue
    full=os.path.join('.',name)
    t='dir' if os.path.isdir(full) else 'file'
    out.append({'name':name,'path':'sp/'+name,'type':t})
with open('filelist.json','w',encoding='utf‑8')as f:
    json.dump(out,f,ensure_ascii=False,indent=2)
          "
      - name: 提交生成的filelist.json
        run: |
          git config user.name "github‑actions[bot]"
          git config user.email "github‑actions[bot]@users.noreply.github.com"
          git add sp/filelist.json
          git commit -m "自动更新sp文件清单" || echo "无变更无需提交"
          git push