name: Auto‑Post Convert PR
on:
  push:
    branches:
      - main

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Timezone Asia/Shanghai
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo 'Asia/Shanghai' | sudo tee /etc/timezone

      - name: Convert raw file to markdown
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          cd "${POST_DIR}"

          for file in *; do
            [[ -d "${file}" ]] && continue
            [[ "${file}" == *.md ]] && continue
            [[ "${file}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}- ]] && continue

            TMP=$(mktemp)
            cat > "${TMP}" <<EOF
---
title: "${file}"
date: ${TODAY}
---
$(cat "${file}")
EOF
            mv "${TMP}" "${TODAY}-${file}.md"
            rm -f "${file}"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot-auto-convert
          title: "Bot自动转换生成文章"
          body: "由Action自动转换原始文件生成，请检查内容后合并"