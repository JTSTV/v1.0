name: Auto‑Post Convert
on:
  push:
    branches:
      - main

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Timezone Asia/Shanghai
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo 'Asia/Shanghai' | sudo tee /etc/timezone

      - name: Convert raw file to markdown
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          cd "${POST_DIR}"

          for file in *; do
            [[ -d "${file}" ]] && continue
            [[ "${file}" == *.md ]] && continue
            [[ "${file}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}- ]] && continue

            TMP=$(mktemp)
            cat > "${TMP}" <<EOF
---
title: "${file}"
date: ${TODAY}
---
$(cat "${file}")
EOF
            mv "${TMP}" "${TODAY}-${file}.md"
            rm -f "${file}"
          done

      - name: try commit push
        run: |
          git config user.name "KBot‑Auto"
          git config user.email "bot@local"
          git add "${POST_DIR}/"
          git commit -m "[SKIP_AUTO_TITLE] auto:文件名生成标题" || true
          git push || true