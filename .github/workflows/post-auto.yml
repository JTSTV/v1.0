name: Auto‑Post Convert LogOnly
on:
  push:
    branches:
      - main

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Timezone Asia/Shanghai
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo 'Asia/Shanghai' | sudo tee /etc/timezone

      - name: Convert raw file and print result to log
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          mkdir -p "${POST_DIR}"
          cd "${POST_DIR}"

          for file in *; do
            [[ -d "${file}" ]] && continue
            [[ "${file}" == *.md ]] && continue
            [[ "${file}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}- ]] && continue

            echo "=================================================="
            echo "文件名：${file}"
            echo "生成文件名：${TODAY}-${file}.md"
            echo "--------复制下面全部内容--------"
            cat <<EOF
---
title: "${file}"
date: ${TODAY}
---
$(cat "${file}")
EOF
            echo "--------复制上面全部内容--------"
            echo "=================================================="
          done