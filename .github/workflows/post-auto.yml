name: Auto‑Post
on:
  push:
    branches: [ main ]

jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    # 提交信息标记 [SKIP_AUTO_TITLE] 就跳过本任务，防止循环
    if: "! contains(github.event.head_commit.message, '[SKIP_AUTO_TITLE]')"
    steps:
      - name: 拉取完整代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false #关闭默认凭证，使用github token

      - name: 设置北京时间
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 自动转换原始文章文件
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          CHANGED=0
          mkdir -p "${POST_DIR}"
          cd "${POST_DIR}"

          for file in *; do
            # 跳过文件夹
            [ -d "${file}" ] && continue
            # 跳过已经是md文件
            [[ "${file}" == *.md ]] && continue
            # 跳过文件名已经以日期开头的文件 YYYY‑MM‑DD‑
            echo "${file}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

            TITLE_FROM_FILENAME="${file}"
            OUT_MD="${TODAY}-${file}.md"
            TMP_RAW=$(mktemp)

            # 安全处理YAML，把双引号转义，防止破坏front‑matter
            ESC_TITLE=$(printf "%s" "${TITLE_FROM_FILENAME}" | sed 's/"/\\"/g')

            {
              echo '---'
              echo "title: \"${ESC_TITLE}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${file}"
            } > "${TMP_RAW}"

            # 删除原始上传文件，写入新md文件
            rm -f "${file}"
            mv "${TMP_RAW}" "${OUT_MD}"
            CHANGED=1
          done

          cd ..
          if [[ ${CHANGED} -eq 0 ]]; then
            echo "✅ 无需要转换的原始文章，退出"
            exit 0
          fi

          # git 用户配置
          git config user.name "KBot‑Auto"
          git config user.email "bot@local"

          git add "${POST_DIR}/"
          git commit -m "[SKIP_AUTO_TITLE] auto:文件名生成标题"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push 修改回仓库
        uses: ad‑m/github‑push‑action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main