<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8;color:#444;padding:20px}
.container{max-width:680px;margin:0 auto}
.header{padding:15px 30px;border-radius:6px;background:#e8e8e8;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.header h2{font:600 20px/1.4 sans-serif;color:#444;margin:0}
.file-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.file-item{
    display:flex;
    flex-direction:column;
    padding:15px 20px 35px;
    border-radius:12px;
    color:#444;
    background:#fff;
    border:1px solid #ddd;
    content-visibility:auto;
}
.file-info{display:flex;align-items:center;margin-bottom:12px}
.icon{font-size:1.5rem;margin-right:12px;flex-shrink:0}
.name-text{font-size:0.82rem;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;align-self:flex-end}
.btn{padding:8px 16px;border-radius:20px;text-decoration:none;font-size:.9rem;font-weight:500;color:#333;border:none;cursor:pointer;background:rgba(255,255,255,.4)}
.btn:active{opacity:0.75}
.loading{grid-column:1/-1;text-align:center;padding:40px;color:#888}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.95);align-items:center;justify-content:center;overflow:hidden}
.modal-content{width:90%;max-width:900px;position:relative;max-height:100vh;display:flex;justify-content:center}
video{width:100%;height:auto;max-height:100vh;border-radius:8px;object-fit:contain;background:#000}
.close-modal{position:absolute;bottom:15px;right:15px;width:40px;height:40px;background:rgba(255,255,255,.9);color:#000;border-radius:50%;text-align:center;line-height:40px;font-size:28px;font-weight:bold;cursor:pointer;z-index:1002;border:none;outline:none;padding:0}
.speed-control{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:5px 10px;
    border-radius:20px;
    font-size:0.7rem;
    z-index:1001;
    display:flex;
    flex-direction:column;
    gap:5px;
}
.speed-btn{
    background:none;
    border:none;
    color:#fff;
    cursor:pointer;
    padding:2px 6px;
    font-size:0.7rem;
    border-radius:4px;
}
@media(max-width:600px){
.container{padding:0}
.header{padding:15px 20px}
.header h2{font-size:18px}
.file-item{padding:12px 15px 30px}
.name-text{font-size:.8rem}
.icon{font-size:1.2rem;margin-right:8px}
.btn{padding:6px 12px;font-size:.8rem}
.modal-content{width:100%;height:100%;border-radius:0}
video{border-radius:0;height:100%}
}
.thumb{
    width:100%;
    aspect-ratio:9 / 16;
    object-fit:fill;
    border-radius:8px;
    display:block;
    margin-bottom:10px;
    background:#888;
}

/* =========新增登录框样式，仅此一处新增CSS========= */
.loginOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;
}
.loginBox{
    width:320px;background:#fff;padding:24px;border-radius:12px;
}
.loginBox h3{text-align:center;margin-bottom:16px;color:#333}
.loginBox input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-bottom:12px}
.loginBox button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px}
.loginTip{color:red;font-size:14px;margin-top:8px;text-align:center}
</style>
</head>
<body>

<!-- =========新增登录弹窗========= -->
<div id="loginOverlay" class="loginOverlay">
    <div class="loginBox">
        <h3>访问验证</h3>
        <input type="password" id="pwdInput" placeholder="输入访问密码">
        <button onclick="doLogin()">登录</button>
        <div class="loginTip" id="loginTip"></div>
    </div>
</div>

<div class="container">
    <div class="header">
        <h2>📂 我的资源列表</h2>
        <span style="font-size:.8rem;color:#007AFF">⚡ 已连接专属加速通道</span>
    </div>
    <ul id="fileList" class="file-list">
        <li class="loading">等待登录...</li>
    </ul>
</div>
<div id="videoModal" class="modal">
    <div class="modal-content">
        <video id="videoPlayer" controls playsinline preload="metadata">您的浏览器不支持 HTML5 视频播放。</video>
        <div class="speed-control">
            <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
            <button class="speed-btn" onclick="setSpeed(1.0)">1.0x</button>
        </div>
        <button class="close-modal" onclick="closeVideo()">&times;</button>
    </div>
</div>

<script>
const owner = 'Jtstv';
const repo = 'v1.0';
const MY_WORKER_BASE = 'https://jiasu.jxqt.eu.org/';
const WORKER_URL = "https://jiasu.jxqt.eu.org";

let token = ""; //登录后拿到token

const modal = document.getElementById('videoModal');
const p = document.getElementById('videoPlayer');
const listWrap = document.getElementById('fileList');
const loginOverlay = document.getElementById("loginOverlay");
const loginTip = document.getElementById("loginTip");

let playLock = false;

function releaseVideoResource(){
    p.pause();
    p.removeAttribute("src");
    p.load();
}

// =========改造getFastUrl：自动带上token参数，图片/视频/json全部走带鉴权的代理=========
function getFastUrl(filePath) {
    const rawGithubUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/${filePath}`;
    const urlObj = new URL(MY_WORKER_BASE + "proxy");
    urlObj.searchParams.set("token", token);
    urlObj.searchParams.set("url", rawGithubUrl);
    return urlObj.toString();
}

function stripExt(name){
    const dot = name.lastIndexOf('.');
    return dot>0 ? name.substring(0,dot) : name;
}

// =========登录函数，新增=========
async function doLogin(){
    const pwd = document.getElementById("pwdInput").value.trim();
    loginTip.innerText = "验证中...";
    try{
        const res = await fetch(`${WORKER_URL}/get-token`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({password:pwd})
        });
        const ret = await res.json();
        if(!ret.ok){
            loginTip.innerText = ret.msg;
            return;
        }
        token = ret.token;
        loginOverlay.style.display = "none";
        //登录成功，开始加载列表
        loadFiles();
    }catch(err){
        loginTip.innerText = "网络错误："+err.message;
    }
}

// =========完全保留你原版loadFiles逻辑，一行不动=========
async function loadFiles(){
    try{
        const jsonUrl = getFastUrl("filelist.json");
        const res = await fetch(jsonUrl);
        if(!res.ok) throw new Error('读取filelist.json失败 status:'+res.status);
        const files = await res.json();
        const filterFiles = files.filter(item=> item.name !== "filelist.json" && item.type !== "dir");
        listWrap.innerHTML = '';
        if(!filterFiles.length){
            listWrap.innerHTML = '<li class="loading">该目录下空空如也</li>';
            return;
        }
        filterFiles.sort((a,b)=>a.name.localeCompare(b.name));
        const frag = document.createDocumentFragment();
        filterFiles.forEach(f => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const isVid = /\.(mp4|mov|webm|m3u8)$/i.test(f.name);
            const showName = stripExt(f.name);
            let thumbHtml = '';
            let btns = '';
            if(isVid) {
                const baseName = stripExt(f.name);
                const thumbPngUrl = getFastUrl(`.thumb/${baseName}.png`);
                thumbHtml = `<img class="thumb" src="${thumbPngUrl}" alt="缩略图" loading="lazy" decoding="async" onerror="this.style.display='none'">`;
                const fastUrl = getFastUrl(f.path);
                btns += `<a href="${fastUrl}" class="btn" target="_blank">下载</a>`;
                btns += `<button onclick="playVideo('${fastUrl.replace(/'/g,"\\'")}')" class="btn">播放</button>`;
            }
            li.innerHTML = `
                ${thumbHtml}
                <div class="file-info">
                    <span class="icon">🎬</span>
                    <span class="name-text">${showName}</span>
                </div>
                <div class="actions">${btns}</div>
            `;
            frag.appendChild(li);
        });
        listWrap.appendChild(frag);
    } catch(e) {
        listWrap.innerHTML = `<li class="loading" style="color:red">加载失败: ${e.message}</li>`;
    }
}

const playVideo = async function(url){
    if(playLock) return;
    if(modal.style.display === 'flex') closeVideo();
    playLock = true;
    try{
        p.src = url;
        modal.style.display = 'flex';
        p.currentTime = 0;
        await p.play();
    }catch(err){
        console.log("浏览器拦截自动播放，请手动点视频内播放按钮");
    }finally{
        setTimeout(()=>{playLock=false},400);
    }
};
const closeVideo = () => {
    releaseVideoResource();
    modal.style.display = 'none';
};
const setSpeed = s => {
    p.playbackRate = s;
};

//页面不自动加载，等待登录成功才调用loadFiles()
</script>
</body>
</html>
