<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#fff;padding:12px}
.item{background:#222;border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer}
.item:active{background:#333}
.modal{position:fixed;inset:0;background:rgba(0,0,0.92);display:none;z-index:99}
.modal.show{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.closeBtn{position:absolute;top:16px;right:16px;background:#333;border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
video{max-width:100%;max-height:80vh;object-fit:contain}
.loginBox{max-width:340px;margin:30vh auto;background:#222;padding:20px;border-radius:10px}
input{width:100%;padding:12px;margin:10px 0;border:none;border-radius:6px;font-size:16px}
button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:16px}
.tip{color:#ff6b6b;margin:10px 0;}
#globalTip{color:#ff6b6b;font-size:16px;margin:16px 0;white-space:pre-wrap}
</style>
</head>
<body>
<!-- 全局提示，登录框隐藏后依然可见 -->
<div id="globalTip"></div>

<div class="loginBox" id="loginBox">
  <h3 style="text-align:center;margin-bottom:12px">已连接专属加速通道</h3>
  <input type="password" id="pwdInput" placeholder="输入访问密码">
  <button onclick="doLogin()">登录</button>
  <div class="tip" id="loginTip"></div>
</div>

<div id="listWrap" style="display:none"></div>

<div class="modal" id="videoModal">
  <button class="closeBtn" onclick="closePlayer()">×</button>
  <video id="videoPlayer" controls playsinline></video>
</div>

<script>
const workerUrl = "https://jiasu.jxqt.eu.org";
const filelistUrl = "https://crsx.eu.org/v1.0/filelist.json";
const videoBaseUrl = "https://crsx.eu.org/v1.0";

let token = "";
const loginBox = document.getElementById("loginBox");
const listWrap = document.getElementById("listWrap");
const videoModal = document.getElementById("videoModal");
const videoPlayer = document.getElementById("videoPlayer");
const globalTip = document.getElementById("globalTip");

function showGlobalMsg(text){
  globalTip.textContent = text;
}
function showLoginMsg(text){
  document.getElementById("loginTip").textContent = text;
}

async function doLogin(){
  const pwd = document.getElementById("pwdInput").value.trim();
  showLoginMsg("正在验证密码...");
  try{
    const res = await fetch(`${workerUrl}/get-token`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:pwd})
    });
    const ret = await res.json();
    if(!ret.ok){
      showLoginMsg(ret.msg || "密码错误");
      return;
    }
    token = ret.token;
    showGlobalMsg("✅登录成功，正在加载文件列表...");
    loginBox.style.display = "none";
    loadFileList();
  }catch(err){
    showLoginMsg(`登录请求失败:${err.message}`);
  }
}

async function loadFileList() {
  try {
    showGlobalMsg("正在通过代理获取filelist.json");
    const res = await fetch(`${workerUrl}/proxy?token=${token}&url=${encodeURIComponent(filelistUrl)}`);
    showGlobalMsg("收到返回，正在解析JSON");
    const files = await res.json();

    if (!Array.isArray(files)) {
      showGlobalMsg("❌错误：返回内容不是数组");
      return;
    }
    showGlobalMsg(`✅读取成功，共${files.length}个文件，正在渲染列表`);
    const list = files.filter(item => item.name !== "filelist.json" && item.type !== "dir");
    list.sort((a, b) => a.name.localeCompare(b.name, "zh"));
    renderList(list);
    showGlobalMsg("");
  } catch (err) {
    showGlobalMsg(`❌加载列表失败: ${err.message}`);
    console.error(err);
  }
}

function renderList(arr){
  listWrap.innerHTML = "";
  arr.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = item.name;
    div.onclick = ()=> openVideo(item.path);
    listWrap.appendChild(div);
  });
  listWrap.style.display = "block";
}

async function openVideo(path){
  const srcUrl = `${videoBaseUrl}/${path}`;
  const proxyUrl = `${workerUrl}/proxy?token=${token}&url=${encodeURIComponent(srcUrl)}`;
  videoPlayer.src = proxyUrl;
  videoModal.classList.add("show");
  try {
    await videoPlayer.play();
  } catch (err) {
    console.warn("自动播放拦截，请手动点击播放");
  }
}

function closePlayer(){
  videoPlayer.pause();
  videoPlayer.removeAttribute("src");
  videoPlayer.load();
  videoModal.classList.remove("show");
}

// 禁用ESC关闭弹窗
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    e.preventDefault();
  }
});
</script>

</body>
</html>
