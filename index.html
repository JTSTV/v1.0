<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 禁止缩放，减少Safari自动隐藏地址栏、页面缩放 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8;color:#444;padding:20px}
.container{max-width:680px;margin:0 auto}
.header{padding:15px 30px;border-radius:6px;background:#e8e8e8;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.header h2{font:600 20px/1.4 sans-serif;color:#444;margin:0}
.file-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.file-item{
    display:flex;
    flex-direction:column;
    padding:15px 20px 20px;
    border-radius:12px;
    color:#444;
    background:#fff;
    border:1px solid #ddd;
    content-visibility:auto;
}
.file-info{display:flex;align-items:center;margin-bottom:12px}
.icon{font-size:1.5rem;margin-right:12px;flex-shrink:0}
.name-text{font-size:0.82rem;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;align-self:flex-end;margin-top:10px}
.btn{padding:8px 16px;border-radius:20px;text-decoration:none;font-size:.9rem;font-weight:500;color:#333;border:none;cursor:pointer;background:rgba(200,200,200,.4)}
.btn:active{opacity:0.75}
.loading{grid-column:1/-1;text-align:center;padding:40px;color:#888}
.thumb{
    width:100%;
    aspect-ratio:9 / 16;
    object-fit:fill;
    border-radius:8px;
    display:block;
    margin-bottom:10px;
    background:#888;
}
/* 页面内视频播放器样式 */
.inline-video{
    width:100%;
    border-radius:8px;
    display:block;
    margin:10px 0;
}
@media(max-width:600px){
.container{padding:0}
.header{padding:15px 20px}
.header h2{font-size:18px}
.file-item{padding:12px 15px 20px}
.name-text{font-size:.8rem}
.icon{font-size:1.2rem;margin-right:8px}
.btn{padding:6px 12px;font-size:.8rem}
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📂 我的资源列表</h2>
        <span style="font-size:.8rem;color:#007AFF">⚡ 直接源站（无Worker加速）</span>
    </div>
    <ul id="fileList" class="file-list">
        <li class="loading">正在加载文件列表...</li>
    </ul>
</div>
<script>
// 全部直接使用当前域名（crsx.eu.org/v1.0），不再经过Worker代理
const BASE = "./";
const listWrap = document.getElementById('fileList');
function getDirectUrl(filePath) {
    return BASE + filePath;
}
function stripExt(name){
    const dot = name.lastIndexOf('.');
    return dot>0 ? name.substring(0,dot) : name;
}
async function loadFiles(){
    try{
        const jsonUrl = getDirectUrl("filelist.json");
        const res = await fetch(jsonUrl);
        if(!res.ok) throw new Error('读取filelist.json失败 status:'+res.status);
        const files = await res.json();
        const filterFiles = files.filter(item=> item.name !== "filelist.json" && item.type !== "dir");
        listWrap.innerHTML = '';
        if(!filterFiles.length){
            listWrap.innerHTML = '<li class="loading">该目录下空空如也</li>';
            return;
        }
        filterFiles.sort((a,b)=>a.name.localeCompare(b.name));
        const frag = document.createDocumentFragment();
        filterFiles.forEach(f => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const isVid = /\.(mp4|mov|webm|m3u8)$/i.test(f.name);
            const showName = stripExt(f.name);
            let thumbHtml = '';
            let videoHtml = '';
            let btns = '';
            if(isVid) {
                const baseName = stripExt(f.name);
                const thumbPngUrl = getDirectUrl(`.thumb/${baseName}.png`);
                const directVideoUrl = getDirectUrl(f.path);
                thumbHtml = `<img class="thumb" src="${thumbPngUrl}" alt="缩略图" onerror="this.style.display='none'">`;
                // playsinline + webkit-playsinline 苹果Safari内联播放，不自动进系统全屏
                videoHtml = `<video class="inline-video" src="${directVideoUrl}" controls playsinline webkit-playsinline preload="metadata"></video>`;
                btns += `<a href="${directVideoUrl}" class="btn" target="_blank">下载</a>`;
            }
            li.innerHTML = `
                ${thumbHtml}
                ${videoHtml}
                <div class="file-info">
                    <span class="icon">🎬</span>
                    <span class="name-text">${showName}</span>
                </div>
                <div class="actions">${btns}</div>
            `;
            frag.appendChild(li);
        });
        listWrap.appendChild(frag);
    } catch(e) {
        listWrap.innerHTML = `<li class="loading" style="color:red">加载失败: ${e.message}</li>`;
    }
}
loadFiles();
</script>
</body>
</html>
