<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8;color:#444;padding:20px}
.container{max-width:680px;margin:0 auto}
.header{padding:15px 30px;border-radius:6px;background:#e8e8e8;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.header h2{font:600 20px/1.4 sans-serif;color:#444;margin:0}
.file-list{list-style:none}
.file-item{display:flex;flex-direction:column;padding:15px 20px 35px;margin-bottom:15px;border-radius:12px;position:relative;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#444}
.file-info{display:flex;align-items:center;margin-bottom:12px}
.icon{font-size:1.5rem;margin-right:12px;flex-shrink:0}
.name-text{font-size:1rem;line-height:1.4;word-break:break-all}
.actions{display:flex;gap:8px;align-self:flex-end}
.btn{padding:8px 16px;border-radius:20px;text-decoration:none;font-size:.9rem;font-weight:500;color:#333;border:none;cursor:pointer;transition:opacity .2s;background:rgba(255,255,255,.4)}
.btn:hover{opacity:.9}
.loading{text-align:center;padding:40px;color:#888}

.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.95);align-items:center;justify-content:center;overflow:hidden}
.modal-content{width:90%;max-width:900px;position:relative;max-height:90vh;display:flex;flex-direction:column}

video{width:100%;background:#000;border-radius:8px;object-fit:contain}
/* 手势层：铺满整个视频画面，接收滑动，透明看不见 */
.gesture-overlay{
    position:absolute;
    left:0;top:0;right:0;bottom:44px;
    z-index:2;
    touch-action:none;
}
/* 自制简易控制栏 */
.custom-controls{
    display:flex;gap:10px;align-items:center;padding:8px 4px;color:#fff}
.custom-controls button{
    background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:0.75rem;cursor:pointer
}
#progressBar{flex:1;height:6px;background:#444;border-radius:3px;cursor:pointer}
#progressFill{height:100%;background:#2b7cff;border-radius:3px;width:0%}

.speed-control{
    position: absolute;
    top: 50%;
    right:10px;
    transform: translateY(-50%);
    background: rgba(0,0,0,.6);
    color: #fff;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 0.7rem;
    z-index:10;
    display: flex;
    flex-direction: column;
    gap:4px;
}
.speed-btn{
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding:2px 4px;
    font-size:0.7rem;
    border-radius:4px;
}
.speed-btn:hover,.speed-btn.active{background:rgba(255,255,255,.3)}

@media(max-width:600px){
.container{padding:0}.header{padding:15px 20px}.header h2{font-size:18px}
.file-item{padding:12px 15px 30px}.name-text{font-size:.95rem}.icon{font-size:1.2rem;margin-right:8px}
.btn{padding:6px 12px;font-size:.8rem}
.modal-content{width:100%;max-height:100vh;height:100vh;border-radius:0}
video{border-radius:0}
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📂 我的资源列表</h2>
        <span id="cdnStatus" style="font-size:.8rem;color:#007AFF">⚡ 已连接专属加速通道</span>
    </div>
    <ul id="fileList" class="file-list">
        <li class="loading">正在加载文件列表...</li>
    </ul>
</div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <video id="videoPlayer" playsinline webkit-playsinline preload="auto"></video>
        <!-- 手势层，铺满视频画面，整个视频上可以滑动 -->
        <div class="gesture-overlay" id="gestureOverlay"></div>
        <!--倍速按钮，层级最高，不受手势层遮挡 -->
        <div class="speed-control" id="speedControl">
            <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
            <button class="speed-btn" onclick="setSpeed(1.0)">1.0x</button>
        </div>
        <!--自制简易控制栏，无多余按钮 -->
        <div class="custom-controls">
            <button id="playToggle">播放</button>
            <div id="progressBar"><div id="progressFill"></div></div>
        </div>
    </div>
</div>

<script>
const owner = 'Jtstv';
const repo = 'v1.0';
const path = 'sp';
const MY_WORKER_BASE = 'https://jiasu.jxqt.eu.org/';
const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
function getFastUrl(filePath) {
    const rawGithubUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/${filePath}`;
    return MY_WORKER_BASE + rawGithubUrl;
}

let globalVideoList = [];
let currentIdx = -1;
let touchXStart = 0;
let touchYStart = 0;
const videoPlayer = document.getElementById('videoPlayer');
const modalDom = document.getElementById('videoModal');
const gestureOverlay = document.getElementById('gestureOverlay');
const playToggleBtn = document.getElementById('playToggle');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');

async function loadFiles(){
    const el = document.getElementById('fileList');
    try{
        const res = await fetch(apiUrl);
        if(!res.ok) throw new Error('无法连接 GitHub API');
        const files = await res.json();
        el.innerHTML = '';
        globalVideoList = files.filter(f=>!f.type&&/\.(mp4|mov|webm|m3u8)$/i.test(f.name));
        if(!files.length){
            el.innerHTML = '<li class="loading">该目录下空空如也</li>';
            return;
        }
        files.sort((a,b) => a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1);
        files.forEach(f => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const isDir = f.type === 'dir';
            const isVid = /\.(mp4|mov|webm|m3u8)$/i.test(f.name);
            let icon = isDir ? '📁' : isVid ? '🎬' : /\.(jpg|jpeg|png|gif)$/i.test(f.name) ? '🖼️' : '📄';
            let btns = '';
            if(isDir) {
                btns = `<span style="font-size:0.8rem;color:#999">文件夹</span>`;
            } else {
                const fastUrl = getFastUrl(f.path);
                btns += `<a href="${fastUrl}" class="btn" target="_blank">下载</a>`;
                if(isVid) {
                    const vidIndex = globalVideoList.findIndex(v=>v.name===f.name);
                    const safeUrl = fastUrl.replace(/'/g, "\\'");
                    btns += `<button onclick="playVideo('${safeUrl}',${vidIndex})" class="btn">播放</button>`;
                }
            }
            li.innerHTML = `
                <div class="file-info">
                    <span class="icon">${icon}</span>
                    <span class="name-text">${f.name}</span>
                </div>
                <div class="actions">${btns}</div>
            `;
            el.appendChild(li);
        });
    } catch(e) {
        el.innerHTML = `<li class="loading" style="color:red">加载失败: ${e.message}</li>`;
    }
}

//打开播放器弹窗
const playVideo = (url,idx) => {
    currentIdx = idx;
    videoPlayer.src = url;
    modalDom.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    videoPlayer.play().catch(err => console.log('需用户交互才能播放'));
    playToggleBtn.textContent = videoPlayer.paused ? '播放' : '暂停';
    //绑定手势，整个视频画面生效
    gestureOverlay.addEventListener('touchstart',ts,{passive:true});
    gestureOverlay.addEventListener('touchend',te,{passive:true});
};

//关闭播放器（手势右滑触发）
const closeVideo = () => {
    modalDom.style.display = 'none';
    gestureOverlay.removeEventListener('touchstart',ts);
    gestureOverlay.removeEventListener('touchend',te);
    videoPlayer.pause();
    videoPlayer.src = '';
    document.body.style.overflow = '';
    currentIdx = -1;
};

//倍速
const setSpeed = s => {
    videoPlayer.playbackRate = s;
    document.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.toggle('active', parseFloat(b.textContent) === s);
    });
};

//播放暂停切换
playToggleBtn.onclick = ()=>{
    if(videoPlayer.paused){
        videoPlayer.play();
        playToggleBtn.textContent = '暂停';
    }else{
        videoPlayer.pause();
        playToggleBtn.textContent = '播放';
    }
};

//进度条拖拽
progressBar.onclick = (e)=>{
    if(!videoPlayer.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const percent = (e.clientX - rect.left)/rect.width;
    videoPlayer.currentTime = videoPlayer.duration * percent;
};
//更新进度条UI
videoPlayer.ontimeupdate = ()=>{
    if(videoPlayer.duration){
        progressFill.style.width = (videoPlayer.currentTime / videoPlayer.duration *100).toFixed(1)+'%';
    }
};
videoPlayer.onplay = ()=> playToggleBtn.textContent='暂停';
videoPlayer.onpause = ()=> playToggleBtn.textContent='播放';

//手势逻辑（直接在视频画面滑动）
function ts(e){
    touchXStart = e.touches[0].clientX;
    touchYStart = e.touches[0].clientY;
}
function te(e){
    if(currentIdx === -1) return;
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX - touchXStart;
    const dy = endY - touchYStart;

    //👉向右横滑视频画面 → 关闭弹窗回到列表
    if(Math.abs(dx) > 85 && Math.abs(dy) < 75 && dx>0){
        closeVideo();
        return;
    }
    //👆上滑视频画面 → 下一个视频
    if(Math.abs(dy) >75 && Math.abs(dx)<85){
        if(dy < -75){
            if(currentIdx < globalVideoList.length-1){
                currentIdx++;
                const nextUrl = getFastUrl(globalVideoList[currentIdx].path);
                videoPlayer.src = nextUrl;
                videoPlayer.play().catch(()=>{});
            }
        }
        //👇下滑视频画面 → 上一个视频
        else if(dy>75){
            if(currentIdx>0){
                currentIdx--;
                const prevUrl = getFastUrl(globalVideoList[currentIdx].path);
                videoPlayer.src = prevUrl;
                videoPlayer.play().catch(()=>{});
            }
        }
    }
}

loadFiles();
</script>
</body>
</html>
