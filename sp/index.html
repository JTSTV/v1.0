<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#eee;padding:12px}
.container{max-width:720px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.header h1{font-size:22px;font-weight:500}
.header .tip{color:#4285f4;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.item{background:#fff;border-radius:14px;overflow:hidden;padding-bottom:12px}
.thumb{width:100%;aspect-ratio:9/12;background:#aaa;display:block;object-fit:cover}
.name{padding:10px 12px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-row{display:flex;gap:10px;padding:0 12px}
button{flex:1;padding:8px;border:none;border-radius:8px;font-size:15px;background:#e8e8e8}
button:active{background:#ddd}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:999}
.modal video{width:100%;max-height:90vh;object-fit:contain}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📁 我的资源列表</h1>
        <span class="tip">⚡ 已连接专属加速通道</span>
    </div>
    <div class="grid" id="listWrap"></div>
</div>
<div class="modal" id="videoModal">
    <video id="videoPlayer" controls></video>
</div>

<script>
const apiUrl = "https://api.github.com/repos/JTSTV/v1.0/contents/sp";
const workerUrl = "https://cdn.jsdelivr.net/gh/JTSTV/v1.0@main/";
const modal = document.getElementById("videoModal");
const video = document.getElementById("videoPlayer");
const listWrap = document.getElementById("listWrap");

function getFastUrl(path){
    return workerUrl + path;
}

async function loadList(){
    const res = await fetch(apiUrl);
    const data = await res.json();
    const videos = data.filter(item=>item.name.toLowerCase().endsWith(".mp4"));
    listWrap.innerHTML = "";
    videos.forEach(v=>{
        const name = v.name;
        const baseName = name.replace(/\.[^.]+$/,"");
        // ========== 这里是修复后的缩略图路径 ==========
        const thumbUrl = getFastUrl(`.thumb/${baseName}.png`);
        const videoUrl = getFastUrl(`sp/${name}`);

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <img class="thumb" src="${thumbUrl}" alt="缩略图" onerror="this.style.background='#aaa'">
            <div class="name">🎬 ${baseName}</div>
            <div class="btn-row">
                <button onclick="openDownload('${videoUrl}','${name}')">下载</button>
                <button onclick="openPlay('${videoUrl}')">播放</button>
            </div>
        `;
        listWrap.appendChild(div);
    })
}

function openPlay(src){
    video.src = src;
    modal.style.display = "flex";
    video.play();
}
function openDownload(src,name){
    const a = document.createElement("a");
    a.href = src;
    a.download = name;
    a.click();
}
modal.onclick = e=>{
    if(e.target === modal){
        video.pause();
        modal.style.display = "none";
    }
}
loadList();
</script>
</body>
</html>
