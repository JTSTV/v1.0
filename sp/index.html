<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8;color:#444;padding:20px}
.container{max-width:680px;margin:0 auto}
.header{padding:15px 30px;border-radius:6px;background:#e8e8e8;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.header h2{font:600 20px/1.4 sans-serif;color:#444;margin:0}
/* 改成Grid双列 */
.file-list{
    list-style:none;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:15px;
}
.file-item{
    display:flex;
    flex-direction:column;
    padding:15px 15px 30px;
    border-radius:12px;
    position:relative;
    color:#444;
    background:#fff;
    border:1px solid #ddd;
    height:100%;
}
.file-info{display:flex;align-items:center;gap:10px;margin-bottom:12px}
/* 缩略图固定尺寸 160*90 */
.thumb{
    width:160px;
    height:90px;
    object-fit:cover;
    border-radius:6px;
    flex-shrink:0;
    background:#ccc;
}
.icon{font-size:1.5rem;flex-shrink:0}
.name-text{font-size:.92rem;line-height:1.4;word-break:break-all}
.actions{display:flex;gap:6px;align-self:flex-end;margin-top:auto}
.btn{padding:7px 12px;border-radius:20px;text-decoration:none;font-size:.8rem;font-weight:500;color:#333;border:none;cursor:pointer;transition:opacity .2s;background:rgba(255,255,255,.4)}
.btn:hover{opacity:.9}
.loading{grid-column: 1 / -1;text-align:center;padding:40px;color:#888}
/* 模态框样式 */
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.95);align-items:center;justify-content:center;overflow:hidden}
.modal-content{width:90%;max-width:900px;position:relative;max-height:100vh;display:flex;justify-content:center}
video{width:100%;height:auto;max-height:100vh;border-radius:8px;object-fit:contain;background:#000}
.close-modal{position:absolute;bottom:15px;right:15px;width:40px;height:40px;background:rgba(255,255,255,.9);color:#000;border-radius:50%;text-align:center;line-height:40px;font-size:28px;font-weight:bold;cursor:pointer;z-index:1002;box-shadow:0 2px 10px rgba(0,0,0,.3);border:none;outline:none;padding:0}
/* — 倍速控制样式更新 — */
.speed-control{
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    background: rgba(0,0,0,.6);
    color: #fff;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    z-index: 1001;
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.speed-btn{
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 2px 6px;
    font-size: 0.7rem;
    border-radius: 4px;
    transition: background .2s;
}
.speed-btn:hover{background:rgba(255,255,255,.3)}
@media(max-width:520px){
    .container{padding:0}
    .header{padding:15px 15px}
    .header h2{font-size:18px}
    /* 小屏幕变回单列 */
    .file-list{grid-template-columns:1fr}
    .file-item{padding:12px 12px 25px}
    .thumb{width:120px;height:68px}
    .name-text{font-size:.9rem}
    .icon{font-size:1.2rem}
    .btn{padding:6px 10px;font-size:.75rem}
    .modal-content{width:100%;height:100%;border-radius:0}
    video{border-radius:0;height:100%}
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📂 我的资源列表</h2>
        <span id="cdnStatus" style="font-size:.8rem;color:#007AFF">⚡ 已连接专属加速通道</span>
    </div>
    <ul id="fileList" class="file-list">
        <li class="loading">正在加载文件列表...</li>
    </ul>
</div>
<!-- 视频播放弹窗 -->
<div id="videoModal" class="modal" onclick="closeVideo()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <video id="videoPlayer" controls playsinline preload="none">您的浏览器不支持 HTML5 视频播放。</video>
        <div class="speed-control" id="speedControl">
            <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
            <button class="speed-btn" onclick="setSpeed(1.0)">1.0x</button>
        </div>
        <button class="close-modal" onclick="closeVideo()">&times;</button>
    </div>
</div>
<script>
// ================= 配置区域 =================
const owner = 'Jtstv';
const repo = 'v1.0';
const path = 'sp';       // 视频目录
const thumbPath = '.thumb';// 缩略图目录，加.，GitHub网页隐藏
const MY_WORKER_BASE = 'https://jiasu.jxqt.eu.org/';
const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
function getFastUrl(filePath) {
    const rawGithubUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/${filePath}`;
    return MY_WORKER_BASE + rawGithubUrl;
}
// ================= 逻辑区域 =================
async function loadFiles(){
    const el = document.getElementById('fileList');
    try{
        const res = await fetch(apiUrl);
        if(!res.ok) throw new Error('无法连接 GitHub API');
        const files = await res.json();
        el.innerHTML = '';
        if(!files.length){
            el.innerHTML = '<li class="loading">该目录下空空如也</li>';
            return;
        }
        files.sort((a,b) => a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1);

        files.forEach(f => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const isDir = f.type === 'dir';
            const isVid = /\.(mp4|mov|webm|m3u8)$/i.test(f.name);
            let icon = isDir ? '📁' : isVid ? '🎬' : /\.(jpg|jpeg|png|gif)$/i.test(f.name) ? '🖼️' : '📄';
            let btns = '';
            let thumbHtml = '';
            if(isDir) {
                btns = `<span style="font-size:0.8rem;color:#999">文件夹</span>`;
            } else {
                const fastUrl = getFastUrl(f.path);
                btns += `<a href="${fastUrl}" class="btn" target="_blank">下载</a>`;
                if(isVid) {
                    // 缩略图：同级.thumb文件夹，同名jpg
                    const thumbName = f.name.replace(/\.[^.]+$/, '.jpg');
                    const thumbFullPath = `${thumbPath}/${thumbName}`;
                    const thumbUrl = getFastUrl(thumbFullPath);
                    thumbHtml = `<img class="thumb" src="${thumbUrl}" alt="缩略图" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\'icon\'>🎬</span>'">`;
                    const safeUrl = fastUrl.replace(/'/g, "\\'");
                    btns += `<button onclick="playVideo('${safeUrl}')" class="btn">播放</button>`;
                }
            }
            li.innerHTML = `
                <div class="file-info">
                    ${thumbHtml || `<span class="icon">${icon}</span>`}
                    <span class="name-text">${f.name}</span>
                </div>
                <div class="actions">${btns}</div>
            `;
            el.appendChild(li);
        });
    } catch(e) {
        el.innerHTML = `<li class="loading" style="color:red;grid-column:1/-1">加载失败: ${e.message}</li>`;
    }
}

const playVideo = url => {
    const m = document.getElementById('videoModal');
    const p = document.getElementById('videoPlayer');
    p.src = url;
    m.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    p.play().catch(()=>{});
};

const closeVideo = () => {
    const m = document.getElementById('videoModal');
    const p = document.getElementById('videoPlayer');
    m.style.display = 'none';
    p.pause();
    p.removeAttribute('src');
    p.load();
    document.body.style.overflow = '';
};

const setSpeed = s => {
    const p = document.getElementById('videoPlayer');
    p.playbackRate = s;
};

loadFiles();
</script>
</body>
</html>
