<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;padding:20px}
.container{max-width:720px;margin:0 auto}
.header{padding:12px 4px;margin-bottom:16px}
.header h2{font:600 18px/1.4 sans-serif;color:#333;margin:0}
.file-list{list-style:none;padding:0}
.file-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    margin-bottom:10px;
    border-radius:10px;
    background:#fff;
    border:1px solid #eaeaea;
}
.file-info{display:flex;align-items:center;min-width:0;flex:1}
.icon{font-size:1.25rem;margin-right:10px;flex-shrink:0}
.name-text{
    font-size:.92rem;
    line-height:1.4;
    word-break:break-all;
    color:#333;
}
.actions{display:flex;gap:8px;flex-shrink:0}
.btn{
    padding:6px 14px;
    border-radius:999px;
    text-decoration:none;
    font-size:.82rem;
    font-weight:500;
    color:#fff;
    border:none;
    cursor:pointer;
    background:#2b7cff;
}
.btn:hover{background:#1f6ae0}
.loading{text-align:center;padding:40px;color:#999;font-size:.9rem}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.9);align-items:center;justify-content:center;overflow:hidden}
.modal-content{width:90%;max-width:900px;position:relative;max-height:100vh;display:flex;justify-content:center}
video{width:100%;height:auto;max-height:100vh;border-radius:8px;object-fit:contain;background:#000}
.close-modal{
    position:absolute;
    bottom:16px;
    right:16px;
    width:40px;
    height:40px;
    background:rgba(255,255,255,.9);
    color:#000;
    border-radius:50%;
    text-align:center;
    line-height:40px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    border:none;
    outline:none;
    padding:0;
}
.speed-control{
    position:absolute;
    top:50%;
    right:14px;
    transform:translateY(-50%);
    background:rgba(0,0,0,.55);
    color:#fff;
    padding:6px 10px;
    border-radius:999px;
    font-size:.72rem;
    z-index:1001;
    display:flex;
    flex-direction:column;
    gap:4px;
}
.speed-btn{
    background:none;
    border:none;
    color:#fff;
    cursor:pointer;
    padding:2px 6px;
    font-size:.72rem;
    border-radius:4px;
}
.speed-btn:hover,.speed-btn.active{background:rgba(255,255,255,.25)}
.tiktok-modal{
    display:none;
    position:fixed;
    z-index:2000;
    left:0;top:0;
    width:100%;height:100%;
    background:#000;
    overflow:hidden;
}
.tiktok-wrap{width:100%;height:100%;touch-action:none}
.tiktok-slider{width:100%;height:100%;transition:transform .28s ease-out}
.tiktok-item{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.tiktok-video{width:100%;height:100%;object-fit:contain}
.tiktok-close{
    position:absolute;
    z-index:10;
    top:16px;
    left:16px;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    color:#fff;
    border:none;
    font-size:22px;
    cursor:pointer;
}
@media(max-width:600px){
    body{padding:14px}
    .container{padding:0}
    .header{padding:10px 2px;margin-bottom:14px}
    .header h2{font-size:17px}
    .file-item{padding:12px 14px;border-radius:8px}
    .name-text{font-size:.88rem}
    .icon{font-size:1.15rem;margin-right:8px}
    .btn{padding:5px 12px;font-size:.78rem}
    .modal-content{width:100%;height:100%;border-radius:0}
    video{border-radius:0;height:100%}
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📂 我的资源列表</h2>
    </div>
    <ul id="fileList" class="file-list">
        <li class="loading">正在加载文件列表...</li>
    </ul>
</div>

<div id="videoModal" class="modal" onclick="closeVideo()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <video id="videoPlayer" controls playsinline webkit-playsinline preload="auto">您的浏览器不支持 HTML5 视频播放。</video>
        <div class="speed-control" id="speedControl">
            <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
            <button class="speed-btn" onclick="setSpeed(1.0)">1.0x</button>
        </div>
        <button class="close-modal" onclick="closeVideo()">&times;</button>
    </div>
</div>

<div id="tiktokModal" class="tiktok-modal">
    <button class="tiktok-close" onclick="closeSlidePlayer()">←</button>
    <div class="tiktok-wrap">
        <div id="tiktokSlider" class="tiktok-slider"></div>
    </div>
</div>

<script>
const owner = 'Jtstv';
const repo = 'v1.0';
const path = 'sp';
const MY_WORKER_BASE = 'https://jiasu.jxqt.eu.org/';
const apiUrl = MY_WORKER_BASE + `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

function getFastUrl(filePath) {
    const rawGithubUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/${filePath}`;
    return MY_WORKER_BASE + rawGithubUrl;
}

let globalVideoList = [];

async function loadFiles(){
    const el = document.getElementById('fileList');
    try{
        const res = await fetch(apiUrl,{headers:{"Accept":"application/vnd.github+json"}});
        if(!res.ok) throw new Error('无法连接 GitHub API');
        const files = await res.json();
        el.innerHTML = '';
        globalVideoList = files.filter(f=>!f.type&&/\.(mp4|mov|webm|m3u8)$/i.test(f.name));

        if(!files.length){
            el.innerHTML = '<li class="loading">该目录下空空如也</li>';
            return;
        }

        files.sort((a,b) => {
            if(a.type !== b.type) return a.type === 'dir' ? -1 : 1;
            return a.name.localeCompare(b.name);
        });

        files.forEach(f => {
            const li = document.createElement('li');
            li.className = 'file-item';

            const isDir = f.type === 'dir';
            const isVid = /\.(mp4|mov|webm|m3u8)$/i.test(f.name);
            const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name);

            let icon = '📄';
            if(isDir) icon = '📁';
            else if(isVid) icon = '🎬';
            else if(isImg) icon = '🖼️';

            let btns = '';

            if(isDir){
                btns = `<span style="font-size:.78rem;color:#999">文件夹</span>`;
            }else{
                const fastUrl = getFastUrl(f.path);
                btns += `<a href="${fastUrl}" class="btn" target="_blank">下载</a>`;

                if(isVid){
                    const vidIndex = globalVideoList.findIndex(v=>v.name===f.name);
                    btns += `<button onclick="openSlidePlayer(${vidIndex})" class="btn">播放</button>`;
                }
            }

            li.innerHTML = `
                <div class="file-info">
                    <span class="icon">${icon}</span>
                    <span class="name-text">${f.name}</span>
                </div>
                <div class="actions">${btns}</div>
            `;
            el.appendChild(li);
        });

    } catch(e) {
        el.innerHTML = `<li class="loading" style="color:#e74c3c">加载失败: ${e.message}</li>`;
    }
}

const playVideo = url => {
    const m = document.getElementById('videoModal');
    const p = document.getElementById('videoPlayer');
    p.src = url;
    m.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    p.play().catch(err => console.log('需用户交互才能播放'));
};

const closeVideo = () => {
    const m = document.getElementById('videoModal');
    const p = document.getElementById('videoPlayer');
    m.style.display = 'none';
    p.pause();
    p.src = '';
    document.body.style.overflow = '';
};

const setSpeed = s => {
    const p = document.getElementById('videoPlayer');
    p.playbackRate = s;
    document.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.toggle('active', parseFloat(b.textContent) === s);
    });
};

let slideIndex = 0;
let touchYStart = 0;
let sliderEl;
let slideVideos = [];

function onVideoEnded(){
    if(slideIndex < globalVideoList.length - 1){
        slideIndex++;
        playCurrentSlide();
    }
}

function openSlidePlayer(startIndex){
    if(globalVideoList.length === 0) return;

    slideIndex = startIndex;
    const modal = document.getElementById('tiktokModal');
    sliderEl = document.getElementById('tiktokSlider');
    sliderEl.innerHTML = '';
    slideVideos = [];

    globalVideoList.forEach((vItem, idx) => {
        const div = document.createElement('div');
        div.className = 'tiktok-item';
        div.style.transform = `translateY(${idx * 100}vh)`;
        div.innerHTML = `
            <video class="tiktok-video" playsinline webkit-playsinline preload="metadata" data-idx="${idx}" src="${getFastUrl(vItem.path)}"></video>
        `;
        sliderEl.appendChild(div);
    });

    slideVideos = sliderEl.querySelectorAll('.tiktok-video');

    slideVideos.forEach(v => {
        v.removeEventListener('ended', onVideoEnded);
        v.addEventListener('ended', onVideoEnded);
    });

    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
    bindTouch();
    playCurrentSlide();
}

function closeSlidePlayer(){
    const modal = document.getElementById('tiktokModal');
    modal.style.display = 'none';

    slideVideos.forEach(v => {
        v.removeEventListener('ended', onVideoEnded);
        v.pause();
        v.src = '';
    });

    document.body.style.overflow = '';
}

function playCurrentSlide(){
    slideVideos.forEach((v, idx) => {
        if(idx === slideIndex){
            v.currentTime = 0;
            v.play().catch(e => {});
        }else{
            v.pause();
        }
    });

    sliderEl.style.transform = `translateY(-${slideIndex * 100}vh)`;
}

function bindTouch(){
    sliderEl.removeEventListener('touchstart', touchStartHandle);
    sliderEl.removeEventListener('touchend', touchEndHandle);
    sliderEl.addEventListener('touchstart', touchStartHandle, {passive: true});
    sliderEl.addEventListener('touchend', touchEndHandle, {passive: true});
}

function touchStartHandle(e){
    touchYStart = e.touches[0].clientY;
}

function touchEndHandle(e){
    const endY = e.changedTouches[0].clientY;
    const diff = endY - touchYStart;

    if(Math.abs(diff) < 60) return;

    if(diff < -60){
        if(slideIndex < globalVideoList.length - 1){
            slideIndex++;
            playCurrentSlide();
        }
    }else if(diff > 60){
        if(slideIndex > 0){
            slideIndex--;
            playCurrentSlide();
        }
    }
}

loadFiles();
</script>
</body>
</html>
